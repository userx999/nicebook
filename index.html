<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ألعاب آدم - Multi Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-effect { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        body { background-color: #0b0f1a; color: white; touch-action: manipulation; }
        .hidden { display: none; }
        canvas { border: 2px solid #3b82f6; background: #000; max-width: 100%; height: auto; display: block; margin: 0 auto; }
        
        /* Block Blast Styling */
        #block-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; background: #1a1a1a; padding: 4px; border-radius: 8px; margin: 0 auto; width: 300px; }
        .cell { width: 35px; height: 35px; background: #333; border-radius: 4px; }
        .filled { background: #3b82f6; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="font-sans">

    <nav class="fixed top-0 w-full z-50 glass-effect px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i data-lucide="gamepad-2" class="text-blue-500 w-8 h-8"></i>
            <span class="font-bold text-xl uppercase">Adam<span class="text-blue-500">Games</span></span>
        </div>
        <div class="text-xs font-mono bg-blue-600/20 px-2 py-1 rounded">1BACSE-6</div>
    </nav>

    <section class="mt-24 px-6 text-center">
        <h1 class="text-3xl font-black mb-2 italic">مركز <span class="text-blue-500">التحطيم</span></h1>
    </section>

    <main class="px-6 pb-20 grid grid-cols-1 gap-6">
        
        <div class="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800">
            <div class="h-32 bg-gradient-to-br from-green-500 to-green-900 flex items-center justify-center">
                <i data-lucide="snake" class="w-12 h-12 text-white/50"></i>
            </div>
            <div class="p-5 flex justify-between items-center">
                <div>
                    <h3 class="font-bold">Snake Game</h3>
                    <p class="text-gray-500 text-xs">كلاسيك الثعبان</p>
                </div>
                <button onclick="openSnake()" class="bg-blue-600 px-6 py-2 rounded-lg font-bold">لعب</button>
            </div>
        </div>

        <div class="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800">
            <div class="h-32 bg-gradient-to-br from-purple-600 to-blue-900 flex items-center justify-center">
                <i data-lucide="layout-grid" class="w-12 h-12 text-white/50"></i>
            </div>
            <div class="p-5 flex justify-between items-center">
                <div>
                    <h3 class="font-bold">Block Blast</h3>
                    <p class="text-gray-500 text-xs">تحطيم المربعات</p>
                </div>
                <button onclick="openBlocks()" class="bg-purple-600 px-6 py-2 rounded-lg font-bold">لعب</button>
            </div>
        </div>

    </main>

    <div id="snake-modal" class="fixed inset-0 z-[100] bg-black/95 hidden flex-col items-center justify-center p-4">
        <div class="flex justify-between w-full max-w-xs mb-4 text-blue-500 font-bold">
            <span>SCORE: <span id="snake-score">0</span></span>
            <button onclick="closeModals()" class="text-red-500"><i data-lucide="x"></i></button>
        </div>
        <canvas id="snake-canvas" width="400" height="400"></canvas>
        <p class="mt-4 text-gray-500 text-xs">Swipe لتحريك الثعبان</p>
    </div>

    <div id="blocks-modal" class="fixed inset-0 z-[100] bg-black/95 hidden flex-col items-center justify-center p-4">
        <div class="flex justify-between w-full max-w-xs mb-4 text-purple-500 font-bold">
            <span>BLOCKS: <span id="block-score">0</span></span>
            <button onclick="closeModals()" class="text-red-500"><i data-lucide="x"></i></button>
        </div>
        <div id="block-grid"></div>
        <div class="mt-6 flex gap-4" id="piece-container">
            </div>
        <p class="mt-4 text-gray-500 text-[10px]">اضغط على المربع لوضع قطعة عشوائية (نسخة الهاتف)</p>
    </div>

    <script>
        lucide.createIcons();

        // General Modal Controls
        function closeModals() {
            document.getElementById('snake-modal').classList.add('hidden');
            document.getElementById('blocks-modal').classList.add('hidden');
            clearInterval(snakeInterval);
        }

        // --- SNAKE LOGIC ---
        const sCanvas = document.getElementById('snake-canvas');
        const sCtx = sCanvas.getContext('2d');
        let snake = [{x:10, y:10}];
        let food = {x:15, y:15};
        let dx=1, dy=0, sScore=0, snakeInterval;

        function openSnake() {
            document.getElementById('snake-modal').classList.remove('hidden');
            sScore = 0; document.getElementById('snake-score').innerText = sScore;
            snake = [{x:10, y:10}]; dx=1; dy=0;
            snakeInterval = setInterval(drawSnake, 100);
        }

        function drawSnake() {
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if(head.x<0) head.x=19; if(head.x>19) head.x=0;
            if(head.y<0) head.y=19; if(head.y>19) head.y=0;
            snake.unshift(head);
            if(head.x===food.x && head.y===food.y) {
                sScore+=10; document.getElementById('snake-score').innerText = sScore;
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            } else { snake.pop(); }
            sCtx.fillStyle="black"; sCtx.fillRect(0,0,400,400);
            sCtx.fillStyle="#ff003c"; sCtx.fillRect(food.x*20, food.y*20, 18, 18);
            sCtx.fillStyle="#00f2ff"; snake.forEach(s=>sCtx.fillRect(s.x*20, s.y*20, 18, 18));
        }

        // Swipe for Snake
        let tsX, tsY;
        document.addEventListener('touchstart', e=>{tsX=e.touches[0].clientX; tsY=e.touches[0].clientY;});
        document.addEventListener('touchend', e=>{
            let dX=e.changedTouches[0].clientX-tsX, dY=e.changedTouches[0].clientY-tsY;
            if(Math.abs(dX)>Math.abs(dY)) { if(dX>0 && dx===0){dx=1;dy=0} else if(dX<0 && dx===0){dx=-1;dy=0} }
            else { if(dY>0 && dy===0){dx=0;dy=1} else if(dY<0 && dy===0){dx=0;dy=-1} }
        });

        // --- BLOCK BLAST LOGIC ---
        let bScore = 0;
        const grid = document.getElementById('block-grid');
        let board = Array(64).fill(0);

        function openBlocks() {
            document.getElementById('blocks-modal').classList.remove('hidden');
            renderGrid();
        }

        function renderGrid() {
            grid.innerHTML = '';
            board.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = `cell ${val ? 'filled' : ''}`;
                cell.onclick = () => placeBlock(i);
                grid.appendChild(cell);
            });
        }

        function placeBlock(i) {
            // وضع قطعة عشوائية (محاكاة للعبة)
            if(!board[i]) {
                board[i] = 1;
                bScore += 5;
                checkLines();
                renderGrid();
                document.getElementById('block-score').innerText = bScore;
            }
        }

        function checkLines() {
            // التحقق من الأسطر (كل 8 مربعات)
            for(let r=0; r<8; r++) {
                let row = board.slice(r*8, (r+1)*8);
                if(row.every(v => v === 1)) {
                    for(let c=0; c<8; c++) board[r*8+c] = 0;
                    bScore += 100;
                }
            }
        }
    </script>
</body>
</html>
