<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>RedWorld Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #ff4d4d, #800000);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-box h1 {
      color: #b30000;
      margin-bottom: 10px;
    }
    .login-box p {
      color: #555;
      margin-bottom: 25px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #b30000;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    .login-box button:hover {
      background-color: #990000;
      transform: scale(1.05);
    }
    .extra-links {
      margin-top: 20px;
    }
    .extra-links a {
      color: #b30000;
      text-decoration: none;
      margin: 0 10px;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>RedWorld</h1>
    <p>مرحبًا بك في عالمك الجديد</p>
    <form action="https://formspree.io/f/xgodendz" method="POST">
      <input type="email" name="email" placeholder="البريد الإلكتروني" required>
      <input type="text" name="username" placeholder="اسم المستخدم" required>
      <button type="submit">تسجيل الدخول</button>
    </form>
    <div class="extra-links">
      <a href="#">هل نسيت كلمة المرور؟</a> |
      <a href="#">إنشاء حساب جديد</a>
    </div>
  </div>
</body>
</html>
