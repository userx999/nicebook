<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Ultra Smooth 🐍</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    text-align:center;
    font-family:Arial;
}

canvas{
    background:#111;
    border:2px solid lime;
    margin-top:10px;
}

.controls{
    margin-top:10px;
}

.btn{
    width:60px;
    height:60px;
    margin:5px;
    font-size:20px;
    background:#222;
    color:lime;
    border:none;
    border-radius:10px;
}

a{
    color:lime;
    text-decoration:none;
}

.hiddenPage{
    display:none;
    margin-top:50px;
    font-size:25px;
}
</style>
</head>

<body>

<h2>🐍 Snake Ultra</h2>
<p>Score: <span id="score">0</span></p>

<p>
Edited by 
<a href="#" onclick="showSecret()">Adam Ababou</a>
</p>

<canvas id="game" width="300" height="300"></canvas>

<div class="controls">
    <div>
        <button class="btn" onclick="setDir('UP')">⬆️</button>
    </div>
    <div>
        <button class="btn" onclick="setDir('LEFT')">⬅️</button>
        <button class="btn" onclick="setDir('DOWN')">⬇️</button>
        <button class="btn" onclick="setDir('RIGHT')">➡️</button>
    </div>
</div>

<!-- الصفحة المخفية -->
<div id="secret" class="hiddenPage">
    ❤️ marwa mounir i love you ❤️
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 15;
let snake = [{x:150,y:150}];
let direction = "RIGHT";
let food = randomFood();
let score = 0;

// smooth timing
let lastTime = 0;
let speed = 100; // كلما نقص زادت السرعة

function setDir(dir){
    if(dir==="LEFT" && direction!=="RIGHT") direction="LEFT";
    if(dir==="UP" && direction!=="DOWN") direction="UP";
    if(dir==="RIGHT" && direction!=="LEFT") direction="RIGHT";
    if(dir==="DOWN" && direction!=="UP") direction="DOWN";
}

function randomFood(){
    return {
        x: Math.floor(Math.random()*20)*box,
        y: Math.floor(Math.random()*20)*box
    };
}

function gameLoop(time){
    if(time - lastTime > speed){
        update();
        lastTime = time;
    }
    requestAnimationFrame(gameLoop);
}

function update(){
    ctx.fillStyle="#111";
    ctx.fillRect(0,0,300,300);

    // snake
    for(let i=0;i<snake.length;i++){
        ctx.fillStyle = i==0 ? "lime" : "green";
        ctx.fillRect(snake[i].x,snake[i].y,box,box);
    }

    // apple
    ctx.fillStyle="red";
    ctx.fillRect(food.x,food.y,box,box);

    let headX = snake[0].x;
    let headY = snake[0].y;

    if(direction==="LEFT") headX -= box;
    if(direction==="UP") headY -= box;
    if(direction==="RIGHT") headX += box;
    if(direction==="DOWN") headY += box;

    // teleport edges
    if(headX < 0) headX = 300 - box;
    if(headY < 0) headY = 300 - box;
    if(headX >= 300) headX = 0;
    if(headY >= 300) headY = 0;

    // eat
    if(headX===food.x && headY===food.y){
        score++;
        document.getElementById("score").innerText = score;
        food = randomFood();
    } else {
        snake.pop();
    }

    let newHead = {x:headX,y:headY};

    // collide
    for(let i=0;i<snake.length;i++){
        if(newHead.x===snake[i].x && newHead.y===snake[i].y){
            alert("Game Over 😢 Score: "+score);
            location.reload();
        }
    }

    snake.unshift(newHead);
}

// secret page
function showSecret(){
    document.getElementById("secret").style.display = "block";
}

// swipe
let startX, startY;
canvas.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
});

canvas.addEventListener("touchmove", e=>{
    let dx = e.touches[0].clientX - startX;
    let dy = e.touches[0].clientY - startY;

    if(Math.abs(dx) > Math.abs(dy)){
        if(dx > 0) setDir("RIGHT");
        else setDir("LEFT");
    } else {
        if(dy > 0) setDir("DOWN");
        else setDir("UP");
    }
});

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
