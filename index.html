<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آدم - مركز الألعاب الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* منع ريفرش الصفحة عند السحب لأسفل */
        html, body { 
            overscroll-behavior-y: contain; 
            background-color: #0b0f1a; 
            color: white; 
            margin: 0; 
            height: 100%; 
            overflow: hidden;
        }
        .glass-effect { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none; }
        canvas { border: 3px solid #3b82f6; background: #000; border-radius: 10px; width: 100%; max-width: 350px; }
        
        /* Block Blast Grid */
        #bb-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; background: #1e293b; padding: 4px; border-radius: 8px; }
        .bb-cell { width: 40px; height: 40px; background: #0f172a; border-radius: 4px; transition: 0.2s; }
        .bb-filled { background: #3b82f6; box-shadow: inset 0 0 8px rgba(0,0,0,0.5); border: 1px solid #60a5fa; }
        
        /* Pieces */
        .piece-option { display: grid; gap: 2px; padding: 5px; background: rgba(255,255,255,0.05); border-radius: 5px; cursor: pointer; }
        .piece-cell { width: 15px; height: 15px; border-radius: 2px; }
    </style>
</head>
<body class="font-sans">

    <nav class="fixed top-0 w-full z-50 glass-effect px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i data-lucide="shield-check" class="text-blue-500 w-6 h-6"></i>
            <span class="font-bold tracking-widest text-lg">ADAM<span class="text-blue-500">SYSTEM</span></span>
        </div>
        <div class="text-[10px] bg-blue-600 px-2 py-0.5 rounded-full font-bold">1BACSE-6</div>
    </nav>

    <main class="h-full pt-20 pb-10 px-6 overflow-y-auto">
        <div class="grid grid-cols-1 gap-6 max-w-md mx-auto">
            
            <div class="bg-gray-900 border-2 border-green-900/30 rounded-3xl p-6 relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 opacity-10 group-hover:scale-110 transition">
                    <i data-lucide="snake" class="w-32 h-32"></i>
                </div>
                <h2 class="text-2xl font-black mb-1">Snake Classic</h2>
                <p class="text-gray-400 text-xs mb-6 italic font-serif">"قانون الغابة: تحرك أو تؤكل"</p>
                <button onclick="openSnake()" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-2xl font-black text-lg transition shadow-lg shadow-green-900/40">تـشـغـيـل</button>
            </div>

            <div class="bg-gray-900 border-2 border-blue-900/30 rounded-3xl p-6 relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 opacity-10 group-hover:scale-110 transition">
                    <i data-lucide="layout-grid" class="w-32 h-32"></i>
                </div>
                <h2 class="text-2xl font-black mb-1">Block Blast IQ</h2>
                <p class="text-gray-400 text-xs mb-6 italic">"رتب المربعات، فجر السطور"</p>
                <button onclick="openBlocks()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-2xl font-black text-lg transition shadow-lg shadow-blue-900/40">تـشـغـيـل</button>
            </div>

        </div>
    </main>

    <div id="snake-modal" class="fixed inset-0 z-[100] bg-[#050505] hidden flex-col items-center justify-start pt-20">
        <div class="flex justify-between w-full max-w-[350px] px-2 mb-4">
            <div class="text-green-500 font-black">SCORE: <span id="s-score">0</span></div>
            <button onclick="closeAll()" class="text-white/50"><i data-lucide="circle-x"></i></button>
        </div>
        
        <canvas id="s-canvas" width="400" height="400"></canvas>

        <div class="grid grid-cols-3 gap-3 mt-8">
            <div></div>
            <button onclick="changeDir(0,-1)" class="w-16 h-16 bg-gray-800 rounded-full flex items-center justify-center active:bg-green-600"><i data-lucide="chevron-up"></i></button>
            <div></div>
            <button onclick="changeDir(-1,0)" class="w-16 h-16 bg-gray-800 rounded-full flex items-center justify-center active:bg-green-600"><i data-lucide="chevron-left"></i></button>
            <button onclick="resetSnake()" class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center active:scale-90 font-bold text-[10px]">RESTART</button>
            <button onclick="changeDir(1,0)" class="w-16 h-16 bg-gray-800 rounded-full flex items-center justify-center active:bg-green-600"><i data-lucide="chevron-right"></i></button>
            <div></div>
            <button onclick="changeDir(0,1)" class="w-16 h-16 bg-gray-800 rounded-full flex items-center justify-center active:bg-green-600"><i data-lucide="chevron-down"></i></button>
            <div></div>
        </div>
    </div>

    <div id="bb-modal" class="fixed inset-0 z-[100] bg-[#050505] hidden flex-col items-center justify-start pt-16">
        <div class="flex justify-between w-full max-w-[330px] px-2 mb-4">
            <div class="text-blue-500 font-black">SCORE: <span id="b-score">0</span></div>
            <button onclick="closeAll()" class="text-white/50"><i data-lucide="circle-x"></i></button>
        </div>

        <div id="bb-grid"></div>

        <div class="mt-8">
            <p class="text-center text-[10px] text-gray-500 mb-2 font-bold">اختار قطعة وضعها في الشبكة</p>
            <div id="bb-options" class="flex gap-4 justify-center"></div>
        </div>
        
        <button onclick="openBlocks()" class="mt-10 bg-gray-800 px-6 py-2 rounded-full text-xs font-bold border border-gray-700">تحديث القطع</button>
    </div>

    <script>
        lucide.createIcons();

        function closeAll() {
            document.querySelectorAll('[id$="-modal"]').forEach(m => m.classList.add('hidden'));
            clearInterval(sInterval);
        }

        // --- SNAKE SYSTEM ---
        const sc = document.getElementById('s-canvas');
        const sx = sc.getContext('2d');
        let snake, food, sDir, sScore, sInterval;

        function openSnake() {
            document.getElementById('snake-modal').classList.remove('hidden');
            resetSnake();
        }

        function resetSnake() {
            clearInterval(sInterval);
            snake = [{x:10,y:10}]; food = {x:5,y:5}; sDir = {x:1,y:0}; sScore = 0;
            document.getElementById('s-score').innerText = sScore;
            sInterval = setInterval(updateSnake, 120);
        }

        function changeDir(x, y) {
            if((x !== -sDir.x) || (y !== -sDir.y)) sDir = {x, y};
        }

        function updateSnake() {
            let head = {x: snake[0].x + sDir.x, y: snake[0].y + sDir.y};
            if(head.x<0)head.x=19; if(head.x>19)head.x=0; if(head.y<0)head.y=19; if(head.y>19)head.y=0;
            
            if(snake.some(s => s.x === head.x && s.y === head.y)) return resetSnake();
            
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                sScore += 10; document.getElementById('s-score').innerText = sScore;
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            } else { snake.pop(); }

            sx.fillStyle = "black"; sx.fillRect(0,0,400,400);
            sx.fillStyle = "#22c55e"; snake.forEach(s => sx.fillRect(s.x*20, s.y*20, 18, 18));
            sx.fillStyle = "#ef4444"; sx.fillRect(food.x*20, food.y*20, 18, 18);
        }

        // --- BLOCK BLAST SYSTEM ---
        let bBoard = Array(64).fill(0);
        let bScore = 0;
        let selectedPiece = null;

        const PIECES = [
            [[1,1],[1,1]], // Square
            [[1,1,1]],     // Line 3
            [[1],[1],[1]], // Vertical 3
            [[1,0],[1,1]], // L Shape
            [[1]]          // Single
        ];

        function openBlocks() {
            document.getElementById('bb-modal').classList.remove('hidden');
            bBoard = Array(64).fill(0); bScore = 0;
            document.getElementById('b-score').innerText = bScore;
            renderBB();
            genOptions();
        }

        function renderBB() {
            const g = document.getElementById('bb-grid'); g.innerHTML = '';
            bBoard.forEach((v, i) => {
                const c = document.createElement('div');
                c.className = `bb-cell ${v?'bb-filled':''}`;
                c.onclick = () => tryPlace(i);
                g.appendChild(c);
            });
        }

        function genOptions() {
            const opt = document.getElementById('bb-options'); opt.innerHTML = '';
            for(let i=0; i<3; i++) {
                const p = PIECES[Math.floor(Math.random()*PIECES.length)];
                const div = document.createElement('div');
                div.className = "piece-option";
                div.onclick = () => {
                    selectedPiece = p;
                    document.querySelectorAll('.piece-option').forEach(el => el.style.border = "none");
                    div.style.border = "2px solid #3b82f6";
                };
                p.forEach(row => {
                    const rDiv = document.createElement('div'); rDiv.className = "flex gap-0.5";
                    row.forEach(cell => {
                        const cDiv = document.createElement('div');
                        cDiv.className = `piece-cell ${cell?'bg-blue-500':'bg-transparent'}`;
                        rDiv.appendChild(cDiv);
                    });
                    div.appendChild(rDiv);
                });
                opt.appendChild(div);
            }
        }

        function tryPlace(idx) {
            if(!selectedPiece) return;
            let r = Math.floor(idx/8), c = idx%8;
            let can = true;
            
            selectedPiece.forEach((row, ri) => {
                row.forEach((v, ci) => {
                    if(v) {
                        let targetR = r + ri, targetC = c + ci;
                        if(targetR > 7 || targetC > 7 || bBoard[targetR*8 + targetC]) can = false;
                    }
                });
            });

            if(can) {
                selectedPiece.forEach((row, ri) => {
                    row.forEach((v, ci) => {
                        if(v) bBoard[(r+ri)*8 + (c+ci)] = 1;
                    });
                });
                bScore += 10;
                checkBB();
                renderBB();
                selectedPiece = null;
                document.getElementById('b-score').innerText = bScore;
                if(document.getElementById('bb-options').querySelectorAll('.piece-option').length === 0) genOptions();
            }
        }

        function checkBB() {
            for(let i=0; i<8; i++) {
                // Check Rows
                let row = bBoard.slice(i*8, (i+1)*8);
                if(row.every(v => v === 1)) {
                    for(let j=0; j<8; j++) bBoard[i*8+j] = 0;
                    bScore += 80;
                }
                // Check Columns
                let col = []; for(let j=0; j<8; j++) col.push(bBoard[j*8+i]);
                if(col.every(v => v === 1)) {
                    for(let j=0; j<8; j++) bBoard[j*8+i] = 0;
                    bScore += 80;
                }
            }
        }
    </script>
</body>
</html>
