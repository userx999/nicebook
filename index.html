<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ألعاب آدم - Snake Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-effect { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        body { background-color: #0b0f1a; color: white; touch-action: none; } /* منع السكرول فاش نلعبو */
        #game-canvas { border: 2px solid #3b82f6; background: #000; display: block; margin: 0 auto; max-width: 100%; height: auto; }
        .hidden { display: none; }
    </style>
</head>
<body class="font-sans">

    <nav class="fixed top-0 w-full z-50 glass-effect px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i data-lucide="gamepad-2" class="text-blue-500 w-8 h-8"></i>
            <span class="font-bold text-xl uppercase">Adam<span class="text-blue-500">Games</span></span>
        </div>
        <div class="text-xs font-mono bg-blue-600/20 px-2 py-1 rounded">1BACSE-6</div>
    </nav>

    <section class="mt-24 px-6 text-center">
        <h1 class="text-3xl font-black mb-2">ألعاب الهاكر <span class="text-blue-500">آدم</span></h1>
        <p class="text-gray-400 text-sm mb-6">اضغط على اللعبة وجرب مهاراتك</p>
    </section>

    <main class="px-6 pb-20">
        <div class="grid grid-cols-1 gap-6">
            
            <div class="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800">
                <div class="h-40 bg-gradient-to-br from-green-500 to-green-900 flex items-center justify-center">
                    <i data-lucide="snake" class="w-16 h-16 text-white/50"></i>
                </div>
                <div class="p-5">
                    <h3 class="font-bold text-lg">الثعبان والتفاحة</h3>
                    <p class="text-gray-400 text-xs mb-4 italic">"ااا لقحبة كون كان طول رجلة كاعما جمل يتحنى"</p>
                    <button onclick="openGame()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition shadow-lg shadow-blue-900/40">
                        العب الآن
                    </button>
                </div>
            </div>

        </div>
    </main>

    <div id="game-modal" class="fixed inset-0 z-[100] bg-black/95 hidden flex-col items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <div class="flex justify-between items-center mb-4">
                <div class="text-blue-500 font-bold">SCORE: <span id="score">0</span></div>
                <button onclick="closeGame()" class="bg-red-500/20 text-red-500 p-2 rounded-full"><i data-lucide="x"></i></button>
            </div>
            
            <canvas id="game-canvas" width="400" height="400"></canvas>
            
            <div class="mt-6 text-center text-gray-500 text-xs">
                استخدم السحب (Swipe) للتحكم في الثعبان
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const modal = document.getElementById('game-modal');
        
        let score = 0;
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let gridSize = 20;
        let tileCount = 20;
        let gameLoop;

        function openGame() {
            modal.classList.remove('hidden');
            resetGame();
            gameLoop = setInterval(draw, 100);
        }

        function closeGame() {
            modal.classList.add('hidden');
            clearInterval(gameLoop);
        }

        function resetGame() {
            score = 0;
            scoreElement.innerText = score;
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            spawnFood();
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function draw() {
            // تحريك الثعبان
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // اصطدام بالحائط (Wall Wrap)
            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            // اصطدام بالذات
            if (snake.some((seg, index) => index !== 0 && seg.x === head.x && seg.y === head.y)) {
                alert("Game Over! Score: " + score);
                resetGame();
                return;
            }

            snake.unshift(head);

            // أكل التفاحة
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                spawnFood();
            } else {
                snake.pop();
            }

            // رسم الخلفية
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم التفاحة
            ctx.fillStyle = "#ff003c";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            // رسم الثعبان
            ctx.fillStyle = "#00f2ff";
            snake.forEach(seg => {
                ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        // التحكم باللمس (Swipe)
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });

        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let xDiff = touchEndX - touchStartX;
            let yDiff = touchEndY - touchStartY;

            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                if (xDiff > 0 && dx === 0) { dx = 1; dy = 0; } // Right
                else if (xDiff < 0 && dx === 0) { dx = -1; dy = 0; } // Left
            } else {
                if (yDiff > 0 && dy === 0) { dx = 0; dy = 1; } // Down
                else if (yDiff < 0 && dy === 0) { dx = 0; dy = -1; } // Up
            }
        });
    </script>
</body>
</html>
