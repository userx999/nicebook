<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Ababoubook Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #ffcccc, #b30000);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 350px;
    }
    .login-box h2 {
      text-align: center;
      color: #b30000;
      margin-bottom: 20px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #b30000;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .login-box button:hover {
      background-color: #990000;
    }
    .extra-links {
      text-align: center;
      margin-top: 15px;
    }
    .extra-links a {
      color: #b30000;
      text-decoration: none;
      margin: 0 10px;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>تسجيل الدخول</h2>
    <form action="https://formspree.io/f/yourFormID" method="POST">
      <input type="email" name="email" placeholder="البريد الإلكتروني" required>
      <input type="text" name="username" placeholder="اسم المستخدم" required>
      <button type="submit">إرسال</button>
    </form>
    <div class="extra-links">
      <a href="#">هل نسيت كلمة المرور؟</a> |
      <a href="#">إنشاء حساب جديد</a>
    </div>
  </div>
</body>
</html>
